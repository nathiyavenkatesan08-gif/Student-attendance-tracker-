<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Attendance Tracker</title>

    <!-- ================= CSS ================= -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5f9;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 25px auto;
        }

        /* Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }

        /* Form */
        .form-section,
        .attendance-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .form-section h2,
        .attendance-section h2 {
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            background: #2563eb;
        }

        button:hover {
            opacity: 0.85;
        }

        .cancel {
            background: #6b7280;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .present {
            background: #16a34a;
        }

        .absent {
            background: #dc2626;
        }

        .edit {
            background: #f59e0b;
        }

        .delete {
            background: #dc2626;
        }

        .low {
            color: #dc2626;
            font-weight: bold;
        }

        .good {
            color: #16a34a;
            font-weight: bold;
        }

        /* Mobile */
        @media (max-width: 800px) {

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }

            form input,
            form button {
                width: 100%;
            }
        }

        @media (max-width: 500px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 23px;
            }

            .form-section,
            .attendance-section {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HTML ================= -->

    <header>
        <h1>Student Attendance Tracker</h1>
        <p>Manage student records and daily attendance</p>
    </header>

    <div class="container">

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card">
                <h3>Present Today</h3>
                <p id="presentToday">0</p>
            </div>

            <div class="card">
                <h3>Absent Today</h3>
                <p id="absentToday">0</p>
            </div>

            <div class="card">
                <h3>Low Attendance</h3>
                <p id="lowAttendance">0</p>
            </div>

        </section>

        <!-- Add Student -->
        <section class="form-section">

            <h2>Add / Edit Student</h2>

            <form id="studentForm">

                <input type="hidden" id="studentId">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="text"
                    id="rollNumber"
                    placeholder="Roll Number"
                    required
                >

                <input
                    type="text"
                    id="course"
                    placeholder="Course / Department"
                    required
                >

                <button type="submit">
                    Save Student
                </button>

                <button
                    type="button"
                    class="cancel"
                    onclick="resetForm()">
                    Cancel
                </button>

            </form>

        </section>

        <!-- Attendance -->
        <section class="attendance-section">

            <div class="top-bar">

                <h2>Daily Attendance</h2>

                <input
                    type="date"
                    id="attendanceDate"
                >

                <input
                    type="text"
                    id="search"
                    placeholder="Search student..."
                    onkeyup="displayStudents()"
                >

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Attendance</th>
                            <th>Percentage</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

        </section>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        let students =
            JSON.parse(localStorage.getItem("students")) || [];

        const form =
            document.getElementById("studentForm");

        const studentTable =
            document.getElementById("studentTable");

        const attendanceDate =
            document.getElementById("attendanceDate");


        // Today's date
        attendanceDate.value =
            new Date().toISOString().split("T")[0];


        // Add / Edit Student
        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const id =
                document.getElementById("studentId").value;

            const name =
                document.getElementById("studentName").value.trim();

            const roll =
                document.getElementById("rollNumber").value.trim();

            const course =
                document.getElementById("course").value.trim();


            if (id) {

                const student =
                    students.find(s => s.id == id);

                student.name = name;
                student.roll = roll;
                student.course = course;

            } else {

                students.push({
                    id: Date.now(),
                    name: name,
                    roll: roll,
                    course: course,
                    attendance: {}
                });

            }

            saveData();
            resetForm();
            displayStudents();

        });


        // Display Students
        function displayStudents() {

            const searchText =
                document
                .getElementById("search")
                .value
                .toLowerCase();

            studentTable.innerHTML = "";

            const date = attendanceDate.value;

            const filteredStudents =
                students.filter(student =>
                    student.name
                    .toLowerCase()
                    .includes(searchText) ||

                    student.roll
                    .toLowerCase()
                    .includes(searchText) ||

                    student.course
                    .toLowerCase()
                    .includes(searchText)
                );


            filteredStudents.forEach(student => {

                const status =
                    student.attendance[date] || "Not Marked";

                const percentage =
                    calculatePercentage(student);


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>${student.roll}</td>

                    <td>${student.name}</td>

                    <td>${student.course}</td>

                    <td>

                        <button
                            class="present"
                            onclick="markAttendance(
                                ${student.id}, 'Present'
                            )">
                            Present
                        </button>

                        <button
                            class="absent"
                            onclick="markAttendance(
                                ${student.id}, 'Absent'
                            )">
                            Absent
                        </button>

                        <p>${status}</p>

                    </td>

                    <td class="${
                        percentage < 75
                        ? 'low'
                        : 'good'
                    }">

                        ${percentage}%

                    </td>

                    <td>

                        <button
                            class="edit"
                            onclick="editStudent(
                                ${student.id}
                            )">
                            Edit
                        </button>

                        <button
                            class="delete"
                            onclick="deleteStudent(
                                ${student.id}
                            )">
                            Delete
                        </button>

                    </td>
                `;

                studentTable.appendChild(row);

            });

            updateDashboard();

        }


        // Mark Attendance
        function markAttendance(id, status) {

            const date = attendanceDate.value;

            if (!date) {
                alert("Please select a date.");
                return;
            }

            const student =
                students.find(s => s.id === id);

            if (!student.attendance) {
                student.attendance = {};
            }

            student.attendance[date] = status;

            saveData();

            displayStudents();

        }


        // Calculate Attendance Percentage
        function calculatePercentage(student) {

            if (!student.attendance) {
                return 0;
            }

            const records =
                Object.values(student.attendance);

            if (records.length === 0) {
                return 0;
            }

            const present =
                records.filter(
                    status => status === "Present"
                ).length;

            return Math.round(
                (present / records.length) * 100
            );

        }


        // Edit Student
        function editStudent(id) {

            const student =
                students.find(s => s.id === id);

            document.getElementById("studentId").value =
                student.id;

            document.getElementById("studentName").value =
                student.name;

            document.getElementById("rollNumber").value =
                student.roll;

            document.getElementById("course").value =
                student.course;

            window.scrollTo({
                top: 200,
                behavior: "smooth"
            });

        }


        // Delete Student
        function deleteStudent(id) {

            if (
                confirm(
                    "Are you sure you want to delete this student?"
                )
            ) {

                students =
                    students.filter(
                        student => student.id !== id
                    );

                saveData();
                displayStudents();

            }

        }


        // Reset Form
        function resetForm() {

            form.reset();

            document.getElementById("studentId").value = "";

        }


        // Dashboard
        function updateDashboard() {

            document.getElementById("totalStudents")
                .textContent = students.length;

            const date = attendanceDate.value;

            let present = 0;
            let absent = 0;
            let low = 0;


            students.forEach(student => {

                if (
                    student.attendance &&
                    student.attendance[date] === "Present"
                ) {
                    present++;
                }

                if (
                    student.attendance &&
                    student.attendance[date] === "Absent"
                ) {
                    absent++;
                }

                if (
                    calculatePercentage(student) < 75
                ) {
                    low++;
                }

            });


            document.getElementById("presentToday")
                .textContent = present;

            document.getElementById("absentToday")
                .textContent = absent;

            document.getElementById("lowAttendance")
                .textContent = low;

        }


        // Save data to browser
        function saveData() {

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

        }


        // Date change
        attendanceDate.addEventListener(
            "change",
            displayStudents
        );


        // Initial display
        displayStudents();

    </script>

</body>
                  </html>
